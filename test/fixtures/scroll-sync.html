<!doctype html>
<html lang="en">
  <head>
    <title>Ace-diff - Scroll Sync Test</title>
    <link rel="stylesheet" href="../../dist/styles.css" />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.41.0/ace.js"
      type="text/javascript"
      charset="utf-8"
    ></script>
    <style>
      .custom {
        height: 300px;
      }
    </style>
  </head>

  <body>
    <div class="custom"></div>

    <script type="module">
      import AceDiff from '../../dist/index.mjs'

      // Long content on both sides with different lengths so that
      // proportional scroll syncing is exercised
      const leftLines = []
      const rightLines = []

      for (let i = 1; i <= 1000; i++) {
        leftLines.push(`// Left line ${i}`)
      }

      for (let i = 1; i <= 1200; i++) {
        rightLines.push(`// Right line ${i}`)
      }

      window.aceDiffer = new AceDiff({
        element: '.custom',
        lockScrolling: true,
        left: {
          content: leftLines.join('\n'),
        },
        right: {
          content: rightLines.join('\n'),
        },
      })
    </script>
  </body>
</html>
